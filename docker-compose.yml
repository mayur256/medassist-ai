services:
  postgres:
    image: postgres:15-alpine
    container_name: medassist-postgres
    environment:
      POSTGRES_DB: medassist
      POSTGRES_USER: medassist
      POSTGRES_PASSWORD: medassist123
    ports:
      - "5437:5432"
    volumes:
      - medassist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medassist"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medassist_pgdata:
