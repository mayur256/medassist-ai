[project]
name = "medassist-cdss"
version = "0.1.0"
description = "AI-powered Clinical Decision Support System"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "transformers==4.47.1",
    "torch==2.5.1",
    "langgraph==0.2.60",
    "langchain-core==0.3.28",
    "sentence-transformers==3.3.1",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "httpx==0.28.1",
    "huggingface-hub==0.27.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
